# Rotating exponential disk around a central point mass; units G = 1, disk scale length 1.
scenario = disk
n = 20000
G = 1
eps = 0.02
dt = 0.005             # orbital period at r = 1 is ~ 6, so ~1000 steps per period at the centre
steps = 2000
# Output: diagnostics every diag_every steps; PNG frame every render_every steps (0 = none);
# snapshot every snap_every steps (0 = none), plus one at the end if snap_final.
method = auto          # direct | tree | auto (direct up to auto_direct_max bodies)
backend = auto         # cpu | cuda | auto (cuda when a GPU is usable)
theta = 0.6            # Barnes-Hut opening angle

diag_every = 100
render_every = 100
view = 20,60           # tilted view: yaw,pitch in degrees
out_dir = out/disk

[disk]
core_mass = 0.1        # central point mass (one body, counts toward n)
mass = 1               # total stellar mass
scale = 1              # exponential scale length
rmax = 5               # truncation radius in scale lengths
thickness = 0.05       # vertical Gaussian sigma in scale lengths
dispersion = 0.05      # velocity dispersion as a fraction of local circular speed
