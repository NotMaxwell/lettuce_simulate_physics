# Cold uniform sphere collapsing under its own gravity (free-fall time ~ 1.1 for G = M = R = 1).
scenario = uniform
n = 20000
G = 1
eps = 0.02
dt = 0.002
steps = 2000           # ~4 time units: collapse, bounce, virialisation
# Output: diagnostics every diag_every steps; PNG frame every render_every steps (0 = none);
# snapshot every snap_every steps (0 = none), plus one at the end if snap_final.
method = auto          # direct | tree | auto (direct up to auto_direct_max bodies)
backend = auto         # cpu | cuda | auto (cuda when a GPU is usable)
theta = 0.6            # Barnes-Hut opening angle

diag_every = 100
render_every = 100
out_dir = out/cold_collapse

[uniform]
shape = sphere         # sphere | cube
radius = 1             # sphere radius or cube half-side
mass = 1
sigma = 0              # Gaussian velocity dispersion per component; 0 = cold
spin = 0               # solid-body spin about z in units of sqrt(G M / R^3)
