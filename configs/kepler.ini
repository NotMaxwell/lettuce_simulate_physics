# Two-body Keplerian orbit; energy and angular momentum should be conserved to round-off-ish.
scenario = kepler
n = 2                  # ignored, always 2 bodies
G = 1
eps = 0
dt = 0.00628318530718  # period/1000 for a = 1, m1 = 1 (period 2*pi)
steps = 10000          # 10 orbits
# Output: diagnostics every diag_every steps; PNG frame every render_every steps (0 = none);
# snapshot every snap_every steps (0 = none), plus one at the end if snap_final.
method = auto          # direct | tree | auto (direct up to auto_direct_max bodies)
backend = auto         # cpu | cuda | auto (cuda when a GPU is usable)
theta = 0.6            # Barnes-Hut opening angle

diag_every = 500
render_every = 0
out_dir = out/kepler

[kepler]
m1 = 1
m2 = 0.001
a = 1                  # semi-major axis
e = 0.3                # eccentricity, 0 <= e < 1
