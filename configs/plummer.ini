# Plummer sphere in Henon units (G = M = 1, total energy -1/4, crossing time ~ 2.8).
scenario = plummer
n = 10000
seed = 1
G = 1
eps = 0.01             # softening; ~ N^(-1/3)/10-ish is typical for N = 1e4
dt = 0.0078125         # 1/128
steps = 1300           # ~10 time units
# Output: diagnostics every diag_every steps; PNG frame every render_every steps (0 = none);
# snapshot every snap_every steps (0 = none), plus one at the end if snap_final.
method = auto          # direct | tree | auto (direct up to auto_direct_max bodies)
backend = auto         # cpu | cuda | auto (cuda when a GPU is usable)
theta = 0.6            # Barnes-Hut opening angle

diag_every = 100
render_every = 100
render_width = 1024
render_height = 1024
view = xy              # xy | xz | yz | <yaw_deg>,<pitch_deg>
out_dir = out/plummer
snap_final = true

[plummer]
mass = 1               # total mass
a = 0.589048622548     # scale radius, 3*pi/16
cut = 20               # radial cut in scale radii
