# Star cluster whose stars each carry planets on circular orbits; cluster in G = M = 1 units.
scenario = systems
n = 10000              # stars = n / (1 + planets); the real count may differ slightly
G = 1
eps = 0.0005           # small enough not to disturb the planetary orbits (r_min = 0.002)
dt = 0.0002            # resolves the innermost orbit period (~ 2*pi*sqrt(r^3/(G m_star)))
steps = 2000
# Output: diagnostics every diag_every steps; PNG frame every render_every steps (0 = none);
# snapshot every snap_every steps (0 = none), plus one at the end if snap_final.
method = auto          # direct | tree | auto (direct up to auto_direct_max bodies)
backend = auto         # cpu | cuda | auto (cuda when a GPU is usable)
theta = 0.6            # Barnes-Hut opening angle

diag_every = 200
render_every = 200
out_dir = out/systems

[systems]
stars = 0              # 0 = derive from n
planets = 4            # per star
cluster_mass = 1       # total star mass
cluster_a = 1          # Plummer scale radius
planet_mass = 0.001    # as a fraction of its star
r_min = 0.002          # innermost planet orbit radius
r_max = 0.02           # outermost
