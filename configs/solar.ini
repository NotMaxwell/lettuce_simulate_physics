# Solar System in AU, years, solar masses (G = 4*pi^2) plus a main-belt asteroid swarm.
scenario = solar
n = 2009               # Sun + 8 planets + 2000 asteroids
G = 39.47841760435743
eps = 0                # point masses
dt = 0.0005            # Mercury's period is 0.24 yr, ~480 steps per orbit
steps = 20000          # 10 years
# Output: diagnostics every diag_every steps; PNG frame every render_every steps (0 = none);
# snapshot every snap_every steps (0 = none), plus one at the end if snap_final.
method = auto          # direct | tree | auto (direct up to auto_direct_max bodies)
backend = auto         # cpu | cuda | auto (cuda when a GPU is usable)
theta = 0.6            # Barnes-Hut opening angle

diag_every = 1000
render_every = 1000
render_extent = 4      # AU; 0 would fit to the asteroid belt and hide the inner planets
out_dir = out/solar

[solar]
belt_inner = 2.2       # AU
belt_outer = 3.3       # AU
belt_incl = 10         # maximum asteroid inclination, degrees
