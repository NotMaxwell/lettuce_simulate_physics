# Two disk galaxies on a near-parabolic encounter; each gets n/2 bodies. G = 1, scale length 1.
scenario = collision
n = 40000
G = 1
eps = 0.03
dt = 0.005
steps = 4000
# Output: diagnostics every diag_every steps; PNG frame every render_every steps (0 = none);
# snapshot every snap_every steps (0 = none), plus one at the end if snap_final.
method = auto          # direct | tree | auto (direct up to auto_direct_max bodies)
backend = auto         # cpu | cuda | auto (cuda when a GPU is usable)
theta = 0.6            # Barnes-Hut opening angle

diag_every = 200
render_every = 100
out_dir = out/collision

[disk]
core_mass = 0.1
mass = 1
scale = 1
rmax = 5
thickness = 0.05
dispersion = 0.05

[collision]
separation = 8         # centre distance, scale lengths (along x)
impact = 2             # offset along y, scale lengths
speed = 0.3            # relative speed as a fraction of the mutual escape speed
inclination = 30       # tilt of the second disk about x, degrees
retrograde = 0         # 1 = second disk counter-rotates
